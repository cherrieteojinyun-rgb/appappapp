
name: Deploy Flet Website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Cache Flet downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/flet
            ~/.flet
            Wangku_Web_Only/build/flutter
          key: flet-web-${{ runner.os }}-${{ hashFiles('Wangku_Web_Only/pyproject.toml', 'Wangku_Web_Only/requirements.txt') }}
          restore-keys: |
            flet-web-${{ runner.os }}-

      - name: Build Flet app
        working-directory: Wangku_Web_Only
        run: |
          uv run --with flet-cli flet build web --yes \
            --base-url "/${GITHUB_REPOSITORY#*/}/" \
            --route-url-strategy hash

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: Wangku_Web_Only/build/web

      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
