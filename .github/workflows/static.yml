
name: Deploy Flet Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Flet downloads
        uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: flet-cache-${{ runner.os }}-${{ hashFiles('Wangku_Web_Only/pyproject.toml', 'Wangku_Web_Only/requirements.txt') }}
          restore-keys: |
            flet-cache-${{ runner.os }}-

      - name: Check Flet version
        working-directory: Wangku_Web_Only
        run: |
          uv run --with flet-cli flet --version

      - name: Build Flet app
        working-directory: Wangku_Web_Only
        env:
          FLET_CACHE_DIR: /home/runner/.flet/cache
          CI: "false"
        run: |
          set -o pipefail

          echo "Checking Flutter installation..."
          uv run --with flet-cli flet doctor -v 2>&1 || true

          echo "Starting Flet web build..."
          uv run --with flet-cli flet build web --yes \
            --verbose \
            --base-url "/${GITHUB_REPOSITORY#*/}/" \
            --route-url-strategy hash 2>&1 | tee flet-build.log

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: Wangku_Web_Only/build/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
