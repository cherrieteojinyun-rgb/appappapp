
name: Deploy Flet Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Flet downloads
        uses: actions/cache@v4
        with:
          path: ~/.flet/cache
          key: flet-cache-${{ runner.os }}-${{ hashFiles('Wangku_Web_Only/pyproject.toml', 'Wangku_Web_Only/requirements.txt') }}
          restore-keys: |
            flet-cache-${{ runner.os }}-

      - name: Build Flet app
        working-directory: Wangku_Web_Only
        run: |
          export FLET_CACHE_DIR="$HOME/.flet/cache"

          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt of 4"

            if uv run --with flet-cli flet build web --yes \
              --base-url "/${GITHUB_REPOSITORY#*/}/" \
              --route-url-strategy hash; then
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              echo "Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Build failed after 4 attempts."
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: Wangku_Web_Only/build/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
