name: Deploy Flet Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build Flet app
        run: |
          uv run flet build web --yes \
            --base-url "${GITHUB_REPOSITORY#*/}" \
            --route-url-strategy hash

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - uses: actions/deploy-pages@v4
