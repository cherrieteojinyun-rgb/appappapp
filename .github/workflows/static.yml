
      - name: Build Flet app
        working-directory: Wangku_Web_Only
        env:
          FLET_CACHE_DIR: ~/.flet/cache
        run: |
          for attempt in 1 2 3 4; do
            echo "Flet build attempt $attempt of 4"

            if uv run --with flet-cli flet build web --yes \
              --base-url "/${GITHUB_REPOSITORY#*/}/" \
              --route-url-strategy hash; then
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              echo "Build failed. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Flet build failed after 4 attempts."
          exit 1
